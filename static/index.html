<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
    --user: #1f4fd1; --user-text: #ffffff; --bot: #ecebe6; --border: #dddcd5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #9a9a93;
      --user: #3d6af0; --user-text: #ffffff; --bot: #2a2a27; --border: #33332f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 14px; cursor: pointer;
  }
  #log {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .assistant.waiting { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); text-align: center; margin-top: 22vh; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chips button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--user); }
  form {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
    background: var(--panel); max-width: 760px; width: 100%; margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px;
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit;
  }
  form button {
    padding: 0 18px; border: 0; border-radius: 10px; background: var(--user);
    color: var(--user-text); font: inherit; font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Chatbot</h1>
  <button id="reset" type="button">Nova conversa</button>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Mensagem…" autofocus></textarea>
  <button id="send" type="submit">Enviar</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  const store = {
    get() { try { return localStorage.getItem("thread_id"); } catch { return null; } },
    set(v) { try { v ? localStorage.setItem("thread_id", v) : localStorage.removeItem("thread_id"); } catch {} },
  };
  let threadId = store.get();

  // Título, introdução e perguntas sugeridas vêm do servidor (/config).
  // As respostas às sugestões ficam em cache, por isso depois da primeira vez aparecem logo.
  let ui = { title: "Chatbot", intro: "", suggestions: [] };

  function renderEmpty() {
    log.innerHTML = '<div class="empty"><p></p><div class="chips"></div></div>';
    log.querySelector(".empty p").textContent = ui.intro;
    const chips = log.querySelector(".chips");
    for (const q of ui.suggestions) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = q;
      b.addEventListener("click", () => { input.value = q; form.requestSubmit(); });
      chips.appendChild(b);
    }
  }

  function add(role, text) {
    log.querySelector(".empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function loadHistory() {
    if (!threadId) return;
    try {
      const res = await fetch("history/" + encodeURIComponent(threadId));
      if (!res.ok) return;
      for (const m of await res.json()) add(m.role, m.content);
    } catch {}
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    add("user", text);
    const bot = add("assistant waiting", "a pensar…");
    send.disabled = true;
    try {
      const res = await fetch("chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, thread_id: threadId }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      threadId = res.headers.get("X-Thread-Id") || threadId;
      store.set(threadId);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let first = true;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (first) { bot.className = "msg assistant"; bot.textContent = ""; first = false; }
        bot.textContent += decoder.decode(value, { stream: true });
        log.scrollTop = log.scrollHeight;
      }
      if (first) { bot.className = "msg assistant"; bot.textContent = "(sem resposta)"; }
    } catch (err) {
      bot.className = "msg assistant";
      bot.textContent = "Erro: " + err.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  document.getElementById("reset").addEventListener("click", () => {
    threadId = null; store.set(null);
    renderEmpty();
    input.focus();
  });

  (async () => {
    try {
      const res = await fetch("config");
      if (res.ok) ui = await res.json();
    } catch {}
    document.title = ui.title;
    document.querySelector("header h1").textContent = ui.title;
    renderEmpty();
    loadHistory();
  })();
</script>
</body>
</html>
