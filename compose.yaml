# Stack completa, 100% open source:
#   llama    llama.cpp (llama-server), descarrega o modelo GGUF do HuggingFace no 1.º arranque
#   chatbot  FastAPI + LangGraph + knowledge base BM25 (http://localhost:8000)
#   langfuse observabilidade (opcional, perfil "langfuse": web, worker, ClickHouse,
#            Postgres, Redis, MinIO) — http://localhost:3000
#
#   ./scripts/init-env.sh [--langfuse]   # cria o .env com segredos aleatórios
#   docker compose up -d
#
# Configuração em .env (ver .env.example).

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
  SALT: ${SALT}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH}

x-langfuse-depends: &langfuse-depends
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  # --- Modelo -----------------------------------------------------------------
  llama:
    # Imagem oficial do llama.cpp (MIT), fixada por digest (build b10644).
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:b6a32c3c9f255853ef29927527068db6c63742e61596dab6aa7b6776740fea68
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    command: >
      -hf ${LLM_HF_MODEL:-unsloth/Qwen3-1.7B-GGUF:Q4_K_M}
      --host 0.0.0.0 --port 8080
      --jinja --reasoning-budget 0
      -c ${LLM_CONTEXT:-6144} --parallel ${LLM_PARALLEL:-2}
      -fa on -ctk q8_0 -ctv q8_0
      --cache-reuse 256 --cache-ram 200
    volumes:
      - models:/models

  # --- Chatbot ----------------------------------------------------------------
  chatbot:
    build: .
    restart: unless-stopped
    depends_on:
      - llama
    env_file:
      - path: .env
        required: false
    environment:
      LLM_BASE_URL: http://llama:8080/v1
      KB_DIR: /app/knowledge
    ports:
      - "${CHAT_BIND:-127.0.0.1}:${CHAT_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge:ro

  # --- Langfuse (opcional: COMPOSE_PROFILES=langfuse) -------------------------
  langfuse-web:
    profiles: [langfuse]
    image: docker.langfuse.com/langfuse/langfuse:4.86.0
    restart: unless-stopped
    depends_on: *langfuse-depends
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3000}:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: default
      LANGFUSE_INIT_ORG_NAME: Default
      LANGFUSE_INIT_PROJECT_ID: chatbot
      LANGFUSE_INIT_PROJECT_NAME: chatbot
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@langfuse.local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
      NODE_OPTIONS: --max-old-space-size=1152
    mem_limit: 1536m

  langfuse-worker:
    profiles: [langfuse]
    image: docker.langfuse.com/langfuse/langfuse-worker:4.86.0
    restart: unless-stopped
    depends_on: *langfuse-depends
    environment:
      <<: *langfuse-env
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 768m

  clickhouse:
    profiles: [langfuse]
    image: docker.io/clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 1g

  minio:
    profiles: [langfuse]
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s
    mem_limit: 256m

  redis:
    profiles: [langfuse]
    image: docker.io/redis:7
    restart: unless-stopped
    command: --requirepass ${REDIS_AUTH} --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    mem_limit: 128m

  postgres:
    profiles: [langfuse]
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    mem_limit: 256m

volumes:
  models:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
